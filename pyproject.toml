[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx-perception-sdk"
version = "0.1.0"
description = "Hardware-agnostic perception-fusion SDK for low-speed autonomous vehicles in enclosed parks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Lynx" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.3",
    "onnxruntime>=1.18",
]
server = [
    "opencv-python>=4.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
