[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynx-perception-sdk"
dynamic = ["version"]
description = "Hardware-agnostic perception-fusion SDK for low-speed autonomous vehicles in enclosed parks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Lynx" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.3",
    "onnxruntime>=1.18",
    "opencv-python>=4.9",
]
server = [
    "opencv-python>=4.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.dynamic]
version = { attr = "sdk.__version__" }

[tool.setuptools.packages.find]
include = ["sdk*"]

[tool.setuptools.package-data]
sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
# The codebase uses prose-friendly long lines in Field descriptions.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts intentionally add the repo root to sys.path before importing sdk.
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
