schema_version: "1.0"

vehicle:
  name: "demo_factory_truck"
  type: "ackermann"
  max_speed_ms: 5.0

domain_controller:
  model: "laptop"                 # laptop | jetson_orin_nano | rk3588
  inference_backend: "onnx_cpu"   # onnx_cpu | onnx_cuda | tensorrt | onnx_acl | onnx_coreml

sensors:
  - name: "front_cam"
    type: "camera"
    model: "demo_replay_cam"
    topic: "cam/front"
    mount: { x: 0.0, y: 0.0, z: 1.4, roll: 0, pitch: 0, yaw: 0 }
    fps: 20
    sync_source: "software"
  - name: "front_lidar"            # enables late fusion (synthetic in the demo)
    type: "lidar"
    model: "demo_replay_lidar"
    topic: "lidar/front"
    mount: { x: 0.1, y: 0.0, z: 1.3, roll: 0, pitch: 0, yaw: 0 }
    sync_source: "software"

perception:
  backend: "offline"              # offline | enhanced | onnx   (config-level switch)
  conf: 0.4                       # detection confidence threshold
  modules: [detection, tracking, traffic_sign]
  roi: { forward_m: 60, lateral_m: 15 }
  small_target_enhance: true      # enhanced backend only — extra ROI pass for small/distant targets

output:
  frame_id: "base_link"
  rate_hz: 10

safety:                           # @ai-lock — validator treats these as read-only
  min_obstacle_height_m: 0.05
  max_detection_latency_ms: 100

data:                             # replay source for the demo/CI loop
  frames_dir: "data/frames"
  index_path: "data/index.csv"
