<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lynx Perception SDK — Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
      background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 16px; padding: 10px 16px;
      background: #161b22; border-bottom: 1px solid #30363d;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .spacer { flex: 1; }
    .badge {
      font-size: 12px; padding: 3px 10px; border-radius: 999px;
      background: #1f6feb; color: #fff;
    }
    .badge.enhanced { background: #a371f7; }
    .badge.onnx { background: #db6d28; }
    .backend-switch { display: inline-flex; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
    .backend-switch button { border: none; border-radius: 0; background: #21262d; padding: 6px 12px; font-size: 12px; }
    .backend-switch button:hover { background: #30363d; }
    .backend-switch button.active { background: #1f6feb; color: #fff; }
    .status { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
    .status.connecting { background: #2a2a2a; color: #d29922; }
    .status.ready { background: #12261e; color: #3fb950; }
    .status.error { background: #2a1214; color: #f85149; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 380px; gap: 12px; padding: 12px; min-height: 0; }
    .panel {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      overflow: hidden; display: flex; flex-direction: column; min-height: 0;
    }
    .panel h2 { font-size: 13px; margin: 0; padding: 10px 14px; border-bottom: 1px solid #30363d; font-weight: 600; }
    .camera-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; }
    #cam { max-width: 100%; max-height: 100%; object-fit: contain; }
    .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    #bev { width: 100%; background: #0a0f14; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid #21262d; }
    th { color: #8b949e; font-weight: 500; }
    .obj-list { overflow-y: auto; }
    .muted { color: #8b949e; font-size: 12px; padding: 10px 14px; }
    .latency-ok { color: #3fb950; } .latency-warn { color: #d29922; }
  </style>
</head>
<body>
  <header>
    <h1>🐆 Lynx Perception SDK</h1>
    <span class="badge" id="backend">offline</span>
    <span class="status connecting" id="status">connecting…</span>
    <span class="spacer"></span>
    <span class="backend-switch" id="backendSwitch">
      <button data-backend="offline">offline</button>
      <button data-backend="enhanced">enhanced</button>
      <button data-backend="onnx">onnx</button>
    </span>
  </header>

  <main>
    <section class="panel">
      <h2>Camera · 相机视角</h2>
      <div class="camera-wrap"><img id="cam" alt="camera" /></div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Bird's-Eye View · 俯视</h2>
        <canvas id="bev" width="360" height="360"></canvas>
      </section>
      <section class="panel obj-list">
        <h2>Objects · 目标</h2>
        <table>
          <thead><tr><th>ID</th><th>类别</th><th>置信度</th><th>速度</th></tr></thead>
          <tbody id="objects"></tbody>
        </table>
        <div class="muted" id="latency">latency —</div>
      </section>
    </aside>
  </main>

  <script>
    // "__ORIGIN__" is replaced with the server origin by the VS Code webview.
    // An empty string means same-origin, which is what the FastAPI dashboard uses.
    const ORIGIN = "__ORIGIN__";
    const BASE = ORIGIN || location.origin;
    const WS_BASE = BASE.replace(/^http/, "ws");
    const $ = (id) => document.getElementById(id);
    const backendEl = $("backend"), statusEl = $("status"), camEl = $("cam");
    const objectsEl = $("objects"), latencyEl = $("latency"), bev = $("bev");
    const ctx = bev.getContext("2d");

    const FOCAL = 500;          // px, fallback depth heuristic only
    const EGO_HEIGHT = 1.2;     // m, nominal obstacle height for the 2D fallback
    const ROI_FORWARD = 60, ROI_LATERAL = 15; // m, matches the demo manifest

    let backend = "offline";
    let camWidth = 1280, camHeight = 720;
    let latencyThreshold = 100;

    function setStatus(kind, text) { statusEl.className = "status " + kind; statusEl.textContent = text; }

    function setActiveBackend(name) {
      const kind = name.startsWith("onnx") ? "onnx" : name;
      document.querySelectorAll("#backendSwitch button").forEach((b) => {
        b.classList.toggle("active", b.dataset.backend === kind);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    function toBEV(o) {
      if (o.bbox_3d) {
        return { depth: o.bbox_3d.x, lateral: -o.bbox_3d.y };
      }
      const b = o.bbox_2d;
      if (!b) return null;
      const depth = Math.min(ROI_FORWARD, (FOCAL * EGO_HEIGHT) / Math.max(b.h, 1));
      const lateral = ((b.x + b.w / 2 - camWidth / 2) / FOCAL) * depth;
      return { depth, lateral };
    }

    function speedLabel(o) {
      const v = o.velocity || [0, 0, 0];
      if (o.bbox_3d && (v[0] || v[1] || v[2])) {
        return `${Math.hypot(v[0], v[1]).toFixed(1)} m/s`;
      }
      const vp = o.velocity_px || [0, 0];
      return `${Math.hypot(vp[0], vp[1]).toFixed(0)} px/s`;
    }

    function drawBEV(frame) {
      ctx.clearRect(0, 0, bev.width, bev.height);
      const cx = bev.width / 2;
      const pxPerM = Math.min(bev.width / (2 * ROI_LATERAL), bev.height / ROI_FORWARD);
      ctx.fillStyle = "#3fb950";
      ctx.fillRect(cx - 8, bev.height - 24, 16, 24);
      if (!frame) return;
      for (const o of frame.objects || []) {
        const p = toBEV(o);
        if (!p) continue;
        const x = cx + p.lateral * pxPerM;
        const y = bev.height - Math.min(ROI_FORWARD, Math.max(0, p.depth)) * pxPerM;
        ctx.fillStyle = o.cls_name.includes("person") ? "#d29922" : "#58a6ff";
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#c9d1d9";
        ctx.font = "10px monospace";
        ctx.fillText(`#${o.track_id} ${o.cls_name} ${p.depth.toFixed(0)}m`, x + 6, y);
      }
    }

    function renderFrame(frame) {
      if (!frame) { setStatus("connecting", "waiting for frames…"); return; }
      const warning = (frame.warnings || []).length > 0;
      setStatus(warning ? "error" : "ready", (warning ? "degraded · " : "ready · ") + frame.backend);
      backendEl.textContent = frame.backend;
      const kind = frame.backend.startsWith("onnx") ? "onnx" : frame.backend;
      backendEl.className = "badge " + kind;
      setActiveBackend(frame.backend);
      backend = frame.backend;

      const rows = (frame.objects || []).map((o) => (
        `<tr><td>${o.track_id}</td><td>${escapeHtml(o.cls_name)}</td>`
        + `<td>${o.confidence.toFixed(2)}</td><td>${escapeHtml(speedLabel(o))}</td></tr>`
      ));
      objectsEl.innerHTML = rows.join("") || '<tr><td colspan="4" class="muted">无目标</td></tr>';

      const ms = frame.latency_ms || 0;
      const ok = ms <= latencyThreshold;
      latencyEl.innerHTML = `latency <span class="${ok ? "latency-ok" : "latency-warn"}">`
        + `${ms.toFixed(1)} ms</span> · backend ${escapeHtml(frame.backend)}`;
      drawBEV(frame);
    }

    let ws;
    function connect() {
      ws = new WebSocket(`${WS_BASE}/ws`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.image) {
          camEl.src = "data:image/jpeg;base64," + msg.image;
          camEl.onload = () => { camWidth = camEl.naturalWidth; camHeight = camEl.naturalHeight; };
        }
        renderFrame(msg.frame);
      };
      ws.onerror = () => { setStatus("error", "⚠ server unreachable"); };
      ws.onclose = () => { setStatus("connecting", "reconnecting…"); setTimeout(connect, 2000); };
    }

    document.querySelectorAll("#backendSwitch button").forEach((b) => {
      b.onclick = async () => {
        const next = b.dataset.backend;
        try {
          const res = await fetch(`${BASE}/api/switch`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ backend: next }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus("error", body.detail || "switch failed");
            return;
          }
          setActiveBackend(next);
          backendEl.textContent = next;
        } catch (err) {
          setStatus("error", "switch failed: " + err.message);
        }
      };
    });

    fetch(`${BASE}/api/state`).then((r) => r.json()).then((state) => {
      if (state.latency_threshold_ms) latencyThreshold = state.latency_threshold_ms;
      if (state.error) setStatus("error", state.error);
    }).catch(() => {});

    drawBEV(null);
    connect();
  </script>
</body>
</html>
